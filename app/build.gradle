plugins { id 'com.android.application' }

def releaseKeys = ['VC_UPLOAD_KEYSTORE', 'VC_UPLOAD_STORE_PASSWORD', 'VC_UPLOAD_KEY_ALIAS', 'VC_UPLOAD_KEY_PASSWORD']
def hasReleaseKeys = releaseKeys.every { System.getenv(it) }
def adApp = System.getenv('VC_ADMOB_APP_ID')
def adUnit = System.getenv('VC_ADMOB_INTERSTITIAL_ID')
if ((adApp && !adUnit) || (!adApp && adUnit)) throw new GradleException('Set both AdMob IDs, or neither for test ads.')
if (adApp && !(adApp ==~ /ca-app-pub-\d{16}~\d{10}/)) throw new GradleException('Invalid AdMob application ID')
if (adUnit && !(adUnit ==~ /ca-app-pub-\d{16}\/\d{10}/)) throw new GradleException('Invalid AdMob interstitial ID')

android {
    namespace 'io.github.oneday1factboop.viciouscycle'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'io.github.oneday1factboop.viciouscycle'
        minSdk 26
        targetSdk 36
        versionCode = (System.getenv('VC_VERSION_CODE') ?: '3').toInteger()
        versionName = System.getenv('VC_VERSION_NAME') ?: '1.1.0'
        resConfigs 'en', 'zh-rTW', 'zh-rHK', 'zh-rCN', 'ja', 'es', 'fr'
        manifestPlaceholders = [admobAppId: 'ca-app-pub-3940256099942544~3347511713']
        buildConfigField 'boolean', 'TEST_ADS', 'true'
        buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', '"ca-app-pub-3940256099942544/1033173712"'
    }
    signingConfigs {
        if (hasReleaseKeys) {
            release {
                storeFile file(System.getenv('VC_UPLOAD_KEYSTORE'))
                storePassword System.getenv('VC_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('VC_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('VC_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            if (hasReleaseKeys) signingConfig signingConfigs.release
            minifyEnabled false
            if (adApp && adUnit) {
                manifestPlaceholders = [admobAppId: adApp]
                buildConfigField 'boolean', 'TEST_ADS', 'false'
                buildConfigField 'String', 'ADMOB_INTERSTITIAL_ID', '"' + adUnit + '"'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    // Play receives the complete AAB; direct APKs contain only their device ABI.
    splits {
        abi { enable true; reset(); include 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'; universalApk false }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/gameAssets')
    lint { abortOnError true; checkReleaseBuilds true }
    testOptions.unitTests.all {
        systemProperty 'vc.data', rootProject.file('game/native-data.json').absolutePath
        systemProperty 'vc.art.report', layout.buildDirectory.file('reports/artwork-layout.json').get().asFile.absolutePath
    }
}

tasks.register('syncGameAssets', Sync) {
    from(rootProject.file('game')) {
        include 'native-data.json', 'assets/**'
    }
    into layout.buildDirectory.dir('generated/gameAssets/game')
}
tasks.named('preBuild').configure { dependsOn 'syncGameAssets' }

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.google.mlkit:translate:17.0.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
