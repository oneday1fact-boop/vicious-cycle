name: Store screenshots
on:
  push:
    branches: [store-screenshots-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare UI capture script
        run: |
          cat > /tmp/capture-store.py <<'PY'
          import subprocess,time,xml.etree.ElementTree as ET,re
          from pathlib import Path
          out=Path("store-captures");out.mkdir(exist_ok=True)
          def adb(*a): return subprocess.check_output(["adb",*a])
          def shot(name):
           time.sleep(3); (out/name).write_bytes(adb("exec-out","screencap","-p"))
          def tap_text(text):
           adb("shell","uiautomator","dump","/sdcard/window.xml")
           xml=adb("shell","cat","/sdcard/window.xml").decode()
           (out/"latest-ui.xml").write_text(xml)
           nodes=[n for n in ET.fromstring(xml).iter("node") if n.get("text")==text]
           if not nodes: raise RuntimeError("Missing UI text: "+text)
           x1,y1,x2,y2=map(int,re.findall(r"\d+",nodes[0].get("bounds")))
           adb("shell","input","tap",str((x1+x2)//2),str((y1+y2)//2));time.sleep(3)
          shot("01-cover.png")
          tap_text("Start")
          tap_text("Continue →")
          tap_text("Enter the story")
          time.sleep(6)
          shot("02-story.png")
          tap_text("Continue ▷")
          time.sleep(6)
          shot("03-choices.png")
          
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb install app/build/outputs/apk/debug/*x86_64*.apk
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -n io.github.oneday1factboop.viciouscycle.debug/io.github.oneday1factboop.viciouscycle.MainActivity
            sleep 8
            python3 /tmp/capture-store.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vicious-cycle-store-captures
          path: store-captures/
