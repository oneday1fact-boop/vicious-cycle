name: Google Play internal upload
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'New version code (higher than every previous upload)'
        required: true
        default: '1'
      version_name:
        description: 'Display version'
        required: true
        default: '1.0.0'
permissions:
  contents: read
jobs:
  upload-internal-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare private signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.VC_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          test -n "$KEYSTORE_BASE64" && test -n "$PLAY_ACCOUNT"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$PLAY_ACCOUNT" > "$RUNNER_TEMP/play-account.json"
      - run: node game/verify.cjs
      - run: node scripts/export-native.cjs && git diff --exit-code game/native-data.json
      - name: Build signed bundle
        env:
          VC_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          VC_UPLOAD_STORE_PASSWORD: ${{ secrets.VC_UPLOAD_STORE_PASSWORD }}
          VC_UPLOAD_KEY_ALIAS: ${{ secrets.VC_UPLOAD_KEY_ALIAS }}
          VC_UPLOAD_KEY_PASSWORD: ${{ secrets.VC_UPLOAD_KEY_PASSWORD }}
          VC_VERSION_CODE: ${{ inputs.version_code }}
          VC_VERSION_NAME: ${{ inputs.version_name }}
          VC_ADMOB_APP_ID: ${{ vars.VC_ADMOB_APP_ID }}
          VC_ADMOB_INTERSTITIAL_ID: ${{ vars.VC_ADMOB_INTERSTITIAL_ID }}
        run: |
          test -n "$VC_UPLOAD_STORE_PASSWORD" && test -n "$VC_UPLOAD_KEY_ALIAS" && test -n "$VC_UPLOAD_KEY_PASSWORD"
          ./gradlew --no-daemon testDebugUnitTest lintRelease bundleRelease
      - run: python -m pip install -r scripts/requirements-play.txt
      - name: Upload internal draft
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/play-account.json
          RELEASE_NAME: ${{ inputs.version_name }}
        run: python scripts/upload_play.py --bundle app/build/outputs/bundle/release/app-release.aab --name "$RELEASE_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: play-internal-bundle
          path: app/build/outputs/bundle/release/*.aab
      - name: Remove private files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play-account.json"
