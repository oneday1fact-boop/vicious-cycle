name: Upload prepared bundle to Play
on:
  workflow_dispatch:
    inputs:
      bundle_ref:
        description: 'Git ref containing the signed Android files'
        required: true
        default: 'android-builds'
permissions:
  contents: read
jobs:
  upload-internal-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download prepared files
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bundle_ref }}
          path: prebuilt
      - name: Verify prepared bundle
        run: |
          cd prebuilt
          test -s vicious-cycle-1.0.0.aab
          sha256sum --check SHA256SUMS.txt
          jarsigner -verify vicious-cycle-1.0.0.aab
      - name: Prepare private Play credential
        env:
          PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          test -n "$PLAY_ACCOUNT"
          printf '%s' "$PLAY_ACCOUNT" > "$RUNNER_TEMP/play-account.json"
      - run: python -m pip install -r scripts/requirements-play.txt
      - name: Upload internal draft
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/play-account.json
          RELEASE_NAME: Native Android preview
        run: python scripts/upload_play.py --bundle prebuilt/vicious-cycle-1.0.0.aab --name "$RELEASE_NAME"
      - name: Remove private credential
        if: always()
        run: rm -f "$RUNNER_TEMP/play-account.json"
