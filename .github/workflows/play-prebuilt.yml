name: Upload prepared bundle to Play
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release containing the signed Android bundle'
        required: true
        default: 'v1.0.0-android-preview'
permissions:
  contents: read
jobs:
  upload-internal-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify prepared bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GAME_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/play-upload"
          gh release download "$RELEASE_TAG" --repo "$GAME_REPOSITORY" --pattern '*.aab' --pattern 'SHA256SUMS.txt' --dir "$RUNNER_TEMP/play-upload"
          cd "$RUNNER_TEMP/play-upload"
          test -s vicious-cycle-1.0.0.aab
          sha256sum --check --ignore-missing SHA256SUMS.txt
          jarsigner -verify vicious-cycle-1.0.0.aab
      - name: Prepare private Play credential
        env:
          PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          test -n "$PLAY_ACCOUNT"
          printf '%s' "$PLAY_ACCOUNT" > "$RUNNER_TEMP/play-account.json"
      - run: python -m pip install -r scripts/requirements-play.txt
      - name: Upload internal draft
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/play-account.json
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/upload_play.py --bundle "$RUNNER_TEMP/play-upload/vicious-cycle-1.0.0.aab" --name "$RELEASE_TAG"
      - name: Remove private credential
        if: always()
        run: rm -f "$RUNNER_TEMP/play-account.json"
